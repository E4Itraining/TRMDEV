# ──────────────────────────────────────────────────────
#  Lab config — shorter training for observability demo
# ──────────────────────────────────────────────────────

model:
  vocab_size: 256
  embed_dim: 64
  hidden_dim: 64
  output_dim: 10
  max_depth: 8
  gate_threshold: 0.5
  num_cells: 2
  dropout: 0.1

data:
  num_train: 2000
  num_val: 500
  seq_len: 32
  num_classes: 10
  max_nest: 4
  seed: 42

training:
  epochs: 5
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 50
  log_every: 5
  val_every: 20
  save_dir: ./checkpoints_lab

graph_server:
  enabled: false
