# ──────────────────────────────────────────────
#  TRM — Tiny Recursive Model  ·  default config
# ──────────────────────────────────────────────

model:
  vocab_size: 256
  embed_dim: 64
  hidden_dim: 64
  output_dim: 10
  max_depth: 8
  gate_threshold: 0.5
  num_cells: 2
  dropout: 0.1

data:
  num_train: 10000
  num_val: 2000
  seq_len: 32
  num_classes: 10
  max_nest: 4
  seed: 42

training:
  epochs: 20
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 100
  log_every: 10
  val_every: 50
  save_dir: ./checkpoints

graph_server:
  enabled: true
  host: "0.0.0.0"
  port: 8050
  refresh_interval_ms: 2000
